version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tripsecure-api
    restart: always
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=development
      - PORT=5000
      - API_VERSION=v1
      - MONGODB_URI=mongodb://mongodb:27017/tripsecure_db
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=supersecretjwtkey_tripsecure_2026_docker
      - JWT_REFRESH_SECRET=supersecretrefreshkey_tripsecure_2026_docker
      - CLIENT_URL=http://localhost:5173
    depends_on:
      - mongodb
      - redis

  mongodb:
    image: mongo:7.0
    container_name: tripsecure-mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7.2-alpine
    container_name: tripsecure-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  mongo_data:
  redis_data:
