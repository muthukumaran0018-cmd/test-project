openapi: 3.0.3
info:
  title: TripSecure API
  version: 0.1.0
  description: API specification for TripSecure backend (Express + TypeScript + Prisma)
servers:
  - url: http://localhost:4000
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Trip:
      type: object
      properties:
        id:
          type: string
        tripCode:
          type: string
        routeName:
          type: string
        busNumber:
          type: string
        coachType:
          type: string
        currentStop:
          type: string
        nextStop:
          type: string
        targetDepartureTime:
          type: string
        departureStatus:
          type: string
          enum: [CLEARED, BLOCKED]
    Passenger:
      type: object
      properties:
        id:
          type: string
        tripId:
          type: string
        name:
          type: string
        phone:
          type: string
        ticketId:
          type: string
        seatNumber:
          type: string
        status:
          type: string
          enum: [ON_BUS_VERIFIED, OUTSIDE_REST_STOP, BOARDING_PENDING]
        lastVerifiedAt:
          type: string
    VerificationEvent:
      type: object
      properties:
        id:
          type: string
        passengerId:
          type: string
        layer:
          type: string
          enum: [QR, CAMERA, GPS]
        result:
          type: string
          enum: [PASS, FAIL]
        confidence:
          type: number
        rawPayload:
          type: object
        createdAt:
          type: string
    CameraDevice:
      type: object
      properties:
        id:
          type: string
        tripId:
          type: string
        label:
          type: string
        status:
          type: string
          enum: [ON, OFF, DISCONNECTED]
        lastHeartbeatAt:
          type: string
        streamUrl:
          type: string
    DetectionEvent:
      type: object
      properties:
        id: { type: string }
        cameraId: { type: string }
        type:
          type: string
          enum: [MOTION, FACE, DROWSINESS]
        boundingBox:
          type: object
        confidence:
          type: number
        createdAt:
          type: string
    TelemetrySnapshot:
      type: object
      properties:
        id: { type: string }
        tripId: { type: string }
        latitude: { type: number }
        longitude: { type: number }
        speedKmh: { type: number }
        temperatureC: { type: number }
        humidity: { type: number }
        weatherCondition: { type: string }
        recordedAt: { type: string }
    Alert:
      type: object
      properties:
        id: { type: string }
        tripId: { type: string }
        severity: { type: string }
        title: { type: string }
        body: { type: string }
        isResolved: { type: boolean }
        createdAt: { type: string }
    User:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string }
        role:
          type: string
          enum: [FLEET_OPERATOR, CONDUCTOR, DRIVER]
    AuthTokens:
      type: object
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
paths:
  /auth/register:
    post:
      summary: Register user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                email: { type: string }
                password: { type: string }
                role:
                  type: string
                  enum: [FLEET_OPERATOR, CONDUCTOR, DRIVER]
      responses:
        '201': { description: Created }
  /auth/login:
    post:
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        '200':
          description: tokens
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
  /auth/refresh:
    post:
      summary: Refresh tokens
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken: { type: string }
      responses:
        '200': { content: { 'application/json': { schema: { $ref: '#/components/schemas/AuthTokens' } } } }
  /trips/{id}:
    get:
      summary: Get trip by id
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { content: { 'application/json': { schema: { $ref: '#/components/schemas/Trip' } } } }
    patch:
      summary: Update trip
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Trip' }
      responses:
        '200': { description: Updated }
  /trips/{id}/summary:
    get:
      summary: Trip summary (counts & progress)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  verifiedCount: { type: integer }
                  outsideCount: { type: integer }
                  pendingCount: { type: integer }
                  boardingProgressPercent: { type: integer }
                  secondsToDeparture: { type: integer }
                  departureStatus: { type: string }
  /trips/{id}/passengers:
    get:
      summary: List passengers for trip
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { content: { 'application/json': { schema: { type: array, items: { $ref: '#/components/schemas/Passenger' } } } } }
  /passengers:
    post:
      summary: Create passenger
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Passenger' }
      responses:
        '201': { description: Created }
  /passengers/{id}/status:
    patch:
      summary: Update passenger status
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [ON_BUS_VERIFIED, OUTSIDE_REST_STOP, BOARDING_PENDING]
      responses:
        '200': { description: Updated }
  /verify/qr:
    post:
      summary: Register a QR verification event
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                ticketId: { type: string }
                tripId: { type: string }
      responses:
        '201': { description: Created }
  /verify/evaluate:
    post:
      summary: Evaluate verification fusion for passenger
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                passengerId: { type: string }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  verdict: { type: string }
                  confidence: { type: number }
  /detections:
    post:
      summary: Ingest detection event
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DetectionEvent'
      responses:
        '201': { description: Created }
  /devices/{id}/heartbeat:
    post:
      summary: Device heartbeat
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                timestamp: { type: string }
      responses:
        '200': { description: OK }
  /telemetry:
    post:
      summary: Ingest telemetry snapshot
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TelemetrySnapshot'
      responses:
        '201': { description: Created }
  /trips/{id}/telemetry/latest:
    get:
      summary: Latest telemetry for trip
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { content: { 'application/json': { schema: { $ref: '#/components/schemas/TelemetrySnapshot' } } } }
  /trips/{id}/alerts:
    get:
      summary: List alerts for trip
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { content: { 'application/json': { schema: { type: array, items: { $ref: '#/components/schemas/Alert' } } } } }
  /alerts/{id}/resolve:
    patch:
      summary: Resolve alert
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Updated }
  /notifications:
    get:
      summary: List notifications for authenticated user
      security:
        - bearerAuth: []
      responses:
        '200': { content: { 'application/json': { schema: { type: array, items: { $ref: '#/components/schemas/Notification' } } } } }
  /simulate/passenger-return:
    post:
      summary: Simulate passenger return (demo)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                tripId: { type: string }
                seatNumber: { type: string }
      responses:
        '200': { description: Emitted }
  /simulate/passenger-exit:
    post:
      summary: Simulate passenger exit (demo)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                tripId: { type: string }
                seatNumber: { type: string }
      responses:
        '200': { description: Emitted }
